<head>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff0f5;--card:#fff;--ac:#ff6f9c;--ac2:#ffd9e6;--tx:#4d2a3b;--mu:#a47b8c;--ok:#5fcf9a}
[data-th=printemps]{--bg:#f1faea;--ac:#e8679f;--ac2:#dff3d2;--tx:#2f4a2b;--mu:#7a9a74;--ok:#3aa76d}
[data-th=ete]{--bg:#fff6dc;--ac:#ff8f2e;--ac2:#ffe3b0;--tx:#4a3420;--mu:#a2845f;--ok:#1fb5a5}
[data-th=automne]{--bg:#fff1e1;--ac:#d4701f;--ac2:#fbdab8;--tx:#4a2f1f;--mu:#a58468;--ok:#7f9a3a}
[data-th=hiver]{--bg:#eaf3ff;--ac:#4a8fe0;--ac2:#d3e6fb;--tx:#23374f;--mu:#6f88a6;--ok:#3bb7c9}
[data-th=noel]{--bg:#eef8f0;--ac:#d6303f;--ac2:#fbd9dc;--tx:#2a3d31;--mu:#6c8b76;--ok:#238a52}
[data-th=nouvelan]{--bg:#f2f0fb;--ac:#6c4fd1;--ac2:#e3dcfa;--tx:#2a2350;--mu:#8479b0;--ok:#d9a21b}
[data-th=paques]{--bg:#fffbe0;--ac:#f2a516;--ac2:#e4f5c4;--tx:#4a4326;--mu:#9a9266;--ok:#e667a2}
[data-th=halloween]{--bg:#fff0de;--ac:#ff7515;--ac2:#e6d9f8;--tx:#3a2347;--mu:#8e739c;--ok:#7a4fc4}
html{background-color:var(--bg);min-height:100%}
body{background:none}
html,body{color:var(--tx);font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;transition:background .3s}
h1,h2,.fr{font-family:Fredoka,Nunito,sans-serif}
body{padding-top:env(safe-area-inset-top)}
.card{background:var(--card);border-radius:22px;box-shadow:0 6px 18px -8px color-mix(in srgb,var(--ac) 45%,transparent)}
.chip{border-radius:999px;padding:.45rem .95rem;font-weight:800;font-size:.9rem;background:var(--card);color:var(--mu);transition:.15s}
.chip.on{background:var(--ac);color:#fff}
.btn{width:46px;height:46px;border-radius:50%;border:3px solid var(--ac);color:transparent;display:grid;place-items:center;font-size:1.3rem;flex:none;transition:.15s}
.btn:active{transform:scale(.88)}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.bubble{width:150px;height:150px;border-radius:50% 46% 54% 50%/52% 50% 50% 48%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--ac2) 0);display:grid;place-items:center;flex:none}
.bubble>div{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.cf{position:fixed;top:-30px;font-size:1.6rem;pointer-events:none;z-index:60;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.toast{pointer-events:none;position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:50;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:translateY(40px) scale(.9);opacity:0}}
.sheet{position:fixed;inset:0;background:#0006;z-index:70;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
input{width:100%;border-radius:14px;padding:.65rem .85rem;background:var(--card);border:2px solid var(--ac2);outline:none}
input:focus{border-color:var(--ac)}
.fab{position:fixed;right:max(18px,calc(50vw - 206px));bottom:calc(88px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;font:600 2.1rem/1 Fredoka,sans-serif;display:grid;place-items:center;z-index:40;box-shadow:0 10px 22px -6px var(--ac)}
.fab:active{transform:scale(.9)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<style>
/* Utilitaires embarqués (plus de CDN Tailwind : fichier autonome, plus léger, utilisable hors-ligne) */
*,::before,::after{box-sizing:border-box;border:0 solid}
body,h1,h2,p{margin:0}
h1,h2{font-size:inherit;font-weight:inherit}
body{line-height:1.5}
button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
.fixed{position:fixed}.bottom-0{bottom:0}.left-0{left:0}.right-0{right:0}
.flex{display:flex}.grid{display:grid}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}
.flex-1{flex:1 1 0%}.flex-none{flex:none}.min-w-0{min-width:0}
.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}.place-items-center{place-items:center}
.grid-cols-7{grid-template-columns:repeat(7,minmax(0,1fr))}
.gap-0\.5{gap:.125rem}.gap-1{gap:.25rem}.gap-1\.5{gap:.375rem}.gap-2{gap:.5rem}.gap-3{gap:.75rem}.gap-4{gap:1rem}.gap-y-1{row-gap:.25rem}
.space-y-2>*+*{margin-top:.5rem}.space-y-3>*+*{margin-top:.75rem}
.max-w-md{max-width:28rem}.mx-auto{margin-left:auto;margin-right:auto}.min-h-screen{min-height:100vh}.w-full{width:100%}
.w-1\.5{width:.375rem}.w-10{width:2.5rem}.w-11{width:2.75rem}
.h-1\.5{height:.375rem}.h-10{height:2.5rem}.h-11{height:2.75rem}.h-12{height:3rem}
.p-1\.5{padding:.375rem}.p-3{padding:.75rem}.p-4{padding:1rem}.p-5{padding:1.25rem}
.px-1{padding-left:.25rem;padding-right:.25rem}.px-2{padding-left:.5rem;padding-right:.5rem}.px-2\.5{padding-left:.625rem;padding-right:.625rem}.px-4{padding-left:1rem;padding-right:1rem}.px-5{padding-left:1.25rem;padding-right:1.25rem}
.py-1{padding-top:.25rem;padding-bottom:.25rem}.py-3{padding-top:.75rem;padding-bottom:.75rem}
.pt-2{padding-top:.5rem}.pt-5{padding-top:1.25rem}.pb-40{padding-bottom:10rem}
.mb-1{margin-bottom:.25rem}.mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:.75rem}.mb-4{margin-bottom:1rem}
.mt-0\.5{margin-top:.125rem}.mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:.75rem}.mt-4{margin-top:1rem}.ml-1{margin-left:.25rem}
.rounded-2xl{border-radius:1rem}.rounded-full{border-radius:9999px}
.text-xs{font-size:.75rem;line-height:1rem}.text-sm{font-size:.875rem;line-height:1.25rem}.text-base{font-size:1rem;line-height:1.5rem}
.text-lg{font-size:1.125rem;line-height:1.75rem}.text-xl{font-size:1.25rem;line-height:1.75rem}.text-2xl{font-size:1.5rem;line-height:2rem}
.text-3xl{font-size:1.875rem;line-height:2.25rem}.text-4xl{font-size:2.25rem;line-height:2.5rem}
.leading-none{line-height:1}.leading-tight{line-height:1.25}.leading-snug{line-height:1.375}
.font-bold{font-weight:700}.font-extrabold{font-weight:800}.text-center{text-align:center}
.capitalize{text-transform:capitalize}.line-through{text-decoration-line:line-through}
.opacity-70{opacity:.7}.opacity-80{opacity:.8}.opacity-95{opacity:.95}
</style>
</head>
<body class="max-w-md mx-auto min-h-screen pb-40">

<header class="px-5 pt-5 flex items-center justify-between">
  <div>
    <h1 class="text-2xl leading-tight" id="ttl">Chez Nous, Tout Doux</h1>
    <p class="text-sm font-bold" style="color:var(--mu)" id="sub"></p>
  </div>
  <button onclick="openSettings()" class="card w-11 h-11 grid place-items-center text-xl" aria-label="Réglages">⚙️</button>
</header>

<main id="main" class="px-4 mt-4 space-y-3"></main>

<nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto px-4 pt-2" style="padding-bottom:calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)">
  <div class="card flex p-1.5 gap-1" id="tabs"></div>
</nav>

<button id="fab" class="fab" onclick="editTask()" aria-label="Ajouter une tâche">+</button>
<div id="layer"></div>

<script>
/* ============ DONNÉES ============ */
// [id, nom, périodicité (jours), icône] — tâches de base ; les tâches ajoutées vivent dans l’état synchronisé
const BASE=[
 ['asp-rdc','Aspirateur & serpillière (RDC)',7,'🧹'],
 ['asp-et','Aspirateur & serpillière (étage)',7,'🧹'],
 ['sdb-rdc','Salle de bain / WC (RDC)',7,'🚿'],
 ['sdb-et','Salle de bain / WC (étage)',7,'🚽'],
 ['dr-par','Changer les draps (parents)',15,'🛏️'],
 ['dr-mar','Changer les draps (Marie)',15,'🧸'],
 ['dr-lou','Changer les draps (Louise)',15,'🌷'],
 ['poub','Désinfecter les poubelles',30,'🗑️'],
 ['frigo','Nettoyer le réfrigérateur',30,'🧊'],
 ['plint','Dépoussiérer plinthes et dessus de meubles',30,'🪶'],
 ['lv','Nettoyer le filtre du lave-vaisselle',90,'🍽️'],
 ['canap','Shampouinage du canapé',90,'🛋️'],
 ['dress','Tri du dressing (changement de saison)',90,'👗'],
 ['vmc','Nettoyer les grilles de VMC et aérations',90,'🌬️'],
 ['vitres','Laver les vitres et fenêtres',365,'🪟']
];
let TASKS=[];
const EMO=['🧹','🧽','🧺','🪣','🧴','🚿','🛁','🚽','🛏️','🧸','🪟','🍽️','🗑️','🧊','🛋️','👗','🌿','🪴','🐾','🚗','🧼','🪥','📦','✨'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PER={7:'chaque semaine',15:'tous les 15 jours',30:'chaque mois',90:'chaque trimestre',365:'chaque année'};
const per=n=>PER[n]||('tous les '+n+' jours');

// {t} = nom de la tâche
const JOKES=[
 ['🥋','Chuck Norris','« {t} » ? Chuck Norris n’a pas eu besoin de le faire : la poussière s’est rendue d’elle-même en te voyant.'],
 ['🥋','Chuck Norris','Chuck Norris dit : « {t} », c’est du niveau ceinture noire. Tu viens de le valider.'],
 ['🥋','Chuck Norris','Même Chuck Norris a pris des notes sur ta technique pour « {t} ». Respect.'],
 ['🎸','Francis Cabrel','Francis Cabrel gratte une petite chanson en ton honneur : « {t} » est terminé, le salon est en paix.'],
 ['🎸','Francis Cabrel','Petite Marie, petite Louise et grande reine du ménage ! « {t} » : c’est fait.'],
 ['🎸','Francis Cabrel','Cabrel t’écrit un refrain, mais en vrai tu mérites tout l’album pour « {t} ».'],
 ['🖤','Indochine','Nicola Sirkis lève le poing : tu es l’aventurière de la maison, « {t} » est dans la boîte !'],
 ['🖤','Indochine','Concert complet ce soir à la maison : « {t} » validé, tout le public est debout.'],
 ['🖤','Indochine','Trois tâches, zéro stress, un look de rock star : « {t} » bien joué !'],
 ['⚗️','Jesse Pinkman','Yo ! « {t} », c’est propre à 99,1 %. Yeah, science !'],
 ['⚗️','Jesse Pinkman','Yeah ! « {t} » terminé. Même Mr. White serait fier de cette pureté.'],
 ['⚗️','Jesse Pinkman','Yo, t’es la meilleure du quartier : « {t} », zéro trace, aucun témoin.']
];
const THEMES={printemps:['🌷','Printemps'],ete:['☀️','Été'],automne:['🍂','Automne'],hiver:['❄️','Hiver'],noel:['🎄','Noël'],nouvelan:['🎆','Nouvel An'],paques:['🐣','Pâques'],halloween:['🎃','Halloween']};
/* Thème automatique : saison en cours ; un thème de fête prend le relais 15 jours avant la date. */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114;return new Date(y,Math.floor(n/31)-1,n%31+1,12)}
function autoTheme(d=new Date()){
  const y=d.getFullYear(),t0=new Date(y,d.getMonth(),d.getDate(),12);
  const near=f=>{const n=Math.round((f-t0)/864e5);return n>=0&&n<=15};
  const md=(d.getMonth()+1)*100+d.getDate();
  if(md>=1210&&md<=1229)return'noel';      // Noël : du 10 au 29 décembre
  if(md>=1230||md<=105)return'nouvelan';   // Nouvel An : du 30 décembre au 5 janvier
  if(near(new Date(y,9,31,12)))return'halloween';
  if(near(easter(y)))return'paques';
  return md>=1221||md<320?'hiver':md<621?'printemps':md<923?'ete':'automne';
}
/* Fonds : 3 motifs par thème, répétés en mosaïque (emoji, plus une boule de Noël dessinée) */
const BALL='<circle r="15" cy="6" fill="#d6303f"/><rect x="-5" y="-14" width="10" height="7" rx="2" fill="#e6bd55"/><path d="M-9 3q3-10 11-9" stroke="#fff" stroke-width="3" fill="none" opacity=".7"/>';
const MOT={printemps:['🌷','🐝','🦋'],ete:['☀️','🍉','🏖️'],automne:['🍂','🌰','🍄'],hiver:['❄️','⛄','🧤'],noel:['🎄','🎅',BALL],nouvelan:['🥂','🎆','🎉'],paques:['🐣','🥚','🐇'],halloween:['🎃','👻','🦇']};
const SPOT=[[40,60,-12],[150,45,10],[215,130,-8],[80,160,8],[170,225,-10],[25,235,12]];
function pattern(th){
  const g=SPOT.map(([x,y,r],i)=>{const m=MOT[th][i%3],tr=`translate(${x} ${y}) rotate(${r})`;
    return m[0]==='<'?`<g transform="${tr}">${m}</g>`:`<text transform="${tr}" font-size="34" text-anchor="middle" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">${m}</text>`}).join('');
  return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260"><g opacity=".4">${g}</g></svg>`)}")`;
}

/* ============ OUTILS DATES ============ */
const $=s=>document.querySelector(s);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T12:00:00');
const add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const diff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const fmt=(s,o)=>pd(s).toLocaleDateString('fr-FR',o||{weekday:'short',day:'numeric',month:'short'});
const monday=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};

/* ============ ÉTAT + SYNCHRO ============ */
// Chaque tâche porte "at" (horodatage) : à la fusion, la modification la plus récente gagne, tâche par tâche.
const init=()=>{const t0=today(),o={};BASE.forEach((k,i)=>o[k[0]]={last:null,next:add(t0,i%Math.min(k[2],7)),at:0});return{tasks:o,abs:{},score:0}};
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const lset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S=ls('mmj',null)||init(), themePref=ls('mmj-theme','auto'), theme='printemps', who=ls('mmj-who',''), cfg=ls('mmj-cfg',null);
let V='day', mo=0, sel=today();

const ids=(a,b)=>[...new Set([...Object.keys(a.tasks),...Object.keys(b?b.tasks:{})])];
const pick=(x,y)=>!y||(x&&x.at>=y.at)?x:y;
const merge=(a,b)=>{const r={tasks:{},abs:{},score:Math.max(a.score||0,b.score||0)};
  ids(a,b).forEach(i=>{r.tasks[i]=pick(a.tasks[i],b.tasks[i])});
  const A=a.abs||{},B=b.abs||{};[...new Set([...Object.keys(A),...Object.keys(B)])].forEach(i=>{r.abs[i]=pick(A[i],B[i])});return r};
const sig=s=>ids(s).sort().map(i=>i+s.tasks[i].at).join()+Object.keys(s.abs||{}).sort().map(i=>i+s.abs[i].at).join()+s.score;
// Liste affichée = tâches de base (modifiables) + tâches ajoutées, sans les supprimées. Textes échappés.
function rebuild(){
  const o=S.tasks,out=[];
  BASE.forEach(d=>{const t=o[d[0]];if(t&&!t.del)out.push([d[0],esc(t.name||d[1]),+(t.days||d[2]),esc(t.icon||d[3])])});
  Object.keys(o).filter(i=>o[i].custom&&!o[i].del).sort((a,b)=>(o[a].ord||0)-(o[b].ord||0))
    .forEach(i=>{const t=o[i];out.push([i,esc(t.name),+t.days||7,esc(t.icon||'✨')])});
  TASKS=out;
}

/* Synchro temps réel : Firebase Realtime Database via REST + SSE (aucun SDK).
   Réglages ⚙️ : URL de la base (https://xxx.firebaseio.com) + code du foyer partagé par les deux personnes.
   Sans configuration : localStorage, synchronisé entre onglets du même appareil. */
const rurl=()=>cfg&&cfg.url&&cfg.code?cfg.url.replace(/\/$/,'')+'/maison/'+encodeURIComponent(cfg.code)+'.json':null;
async function push(){const u=rurl();if(u)try{await fetch(u,{method:'PUT',body:JSON.stringify(S)})}catch(e){}}
async function pull(){const u=rurl();if(!u)return;
  try{const r=await(await fetch(u)).json();
    if(r&&r.tasks){const m=merge(S,r);const ch=sig(m)!==sig(S);S=m;lset('mmj',S);if(ch)render();if(sig(m)!==sig(r))push()}
    else push()}catch(e){}}
let es;function listen(){if(es)es.close();const u=rurl();if(!u)return;try{es=new EventSource(u);es.addEventListener('put',pull);es.addEventListener('patch',pull)}catch(e){}}
function save(){lset('mmj',S);push()}
window.addEventListener('storage',e=>{if(e.key==='mmj'){S=ls('mmj',S);render()}});

/* ============ ACTIONS ============ */
function validate(id){
  const k=TASKS.find(x=>x[0]===id),t=S.tasks[id],d=today();
  if(!k||!t||t.last===d)return; // déjà validée aujourd’hui (double appui) : on ne compte pas deux fois
  t.prev={last:t.last,next:t.next};t.last=d;t.next=add(d,k[2]);t.by=who;t.at=Date.now();S.score++;
  save();render();celebrate(k);
}
function undo(id){
  const t=S.tasks[id];if(!t.prev)return;
  t.last=t.prev.last;t.next=t.prev.next;t.prev=null;t.at=Date.now();S.score=Math.max(0,S.score-1);save();render();
}
function celebrate(k){
  const [ic,who_,txt]=JOKES[Math.floor(Math.random()*JOKES.length)];
  const nm=nextMap(add(today(),1))[k[0]],nxt=nm?nm.d:S.tasks[k[0]].next;
  const base=THEMES[theme][0],set=[base,'✨','💖',base,'🎉'];
  for(let i=0;i<26;i++){const s=document.createElement('span');s.className='cf';s.textContent=set[i%set.length];
    s.style.left=Math.random()*95+'vw';s.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2600)}
  if(navigator.vibrate)navigator.vibrate(40);
  $('#layer').innerHTML=`<div class="toast card p-4 flex gap-3 items-center" onclick="this.remove()">
    <div class="text-4xl">${ic}</div>
    <div><div class="fr text-sm" style="color:var(--ac)">${who_}</div>
    <div class="font-bold leading-snug">${txt.replace('{t}',k[1])}</div>
    <div class="text-sm font-extrabold mt-2" style="color:var(--ac)">📅 Prochaine fois : ${fmt(nxt,{weekday:'long',day:'numeric',month:'long'})} (dans ${diff(nxt,today())} jours)</div></div></div>`;
  clearTimeout(window._tt);window._tt=setTimeout(()=>{const e=$('.toast');if(e)e.remove()},5200);
}

/* ============ CALCUL DES OCCURRENCES ============ */
/* ---- Vacances scolaires zone B (dernier jour de congé inclus) : à compléter chaque année ---- */
const VS=[['2026-10-17','2026-11-01','Toussaint'],['2026-12-19','2027-01-03','Noël'],['2027-02-20','2027-03-07','Hiver'],
  ['2027-04-17','2027-05-02','Printemps'],['2027-07-03','2027-09-01','Été'],['2027-10-23','2027-11-07','Toussaint']];
const D0={day:'numeric',month:'short'};
const inAbs=d=>Object.values(S.abs||{}).some(a=>a&&!a.del&&d>=a.from&&d<=a.to);
const inVac=d=>VS.some(v=>d>=v[0]&&d<=v[1]);
const resume=f=>{let d=today();for(let i=0;i<400&&f(d);i++)d=add(d,1);return d};
const legend=`<p class="text-xs font-bold mt-2 text-center" style="color:var(--mu)">🟠 à faire · 🟢 tout est fait · trait bleu : vacances scolaires · trait gris : absence</p>`;

/* Règles :
   - absence : toutes les tâches à venir sont décalées du nombre de jours d’absence (rien n’est programmé pendant l’absence) ;
   - vacances scolaires : seules les tâches de 15 jours ou moins ; les autres sont reportées après les vacances,
     2 par semaine maximum, dans l’ordre où elles étaient prévues.
   Calcul à l’affichage : la prochaine date de chaque tâche reste « validation + périodicité ». */
function plan(to){
  const T=today(),out=[],cur={},cnt={},nn={};
  const ab=Object.values(S.abs||{}).filter(a=>a&&!a.del).sort((x,y)=>x.from<y.from?-1:1);
  // Une absence située entre la dernière réalisation (prev) et l’échéance (d) décale cette échéance du nombre de jours d’absence
  const shift=(prev,d)=>{ab.forEach(a=>{if(prev<a.from&&d>=a.from)d=add(d,diff(a.to,a.from)+1)});return d};
  TASKS.forEach(k=>{const t=S.tasks[k[0]];cur[k[0]]=shift(t.last||T,t.next);nn[k[0]]=0});
  for(let g=0;g<1500;g++){
    let k=null;TASKS.forEach(x=>{const d=cur[x[0]];if(d<=to&&(!k||d<cur[k[0]]))k=x});
    if(!k)break;
    const id=k[0],nom=cur[id],long=k[2]>15,bl=d=>inAbs(d)||(long&&inVac(d));
    let s=nom<T?T:nom,rep=0;
    if(bl(s)){
      let f=s;for(let i=0;i<400&&bl(f);i++)f=add(f,1);
      s=f;rep=1;
      if(long){let b=0;while((cnt[f+b]||0)>=2)b++;const c=cnt[f+b]||0;cnt[f+b]=c+1;
        s=add(f,7*b+3*c);for(let i=0;i<60&&bl(s);i++)s=add(s,1)}
    }
    if(nom<T)for(let d=nom;d<T&&d<=to;d=add(d,1))out.push({k,d,late:diff(d,nom),n:-1,rep:0}); // rappel les jours précédents
    cur[id]=s>to?'9999-12-31':shift(s,add(s,k[2]));
    if(s<=to)out.push({k,d:s,late:s===T&&nom<T?diff(T,nom):0,n:nn[id]++,rep});
  }
  return out;
}
function occ(from,to){
  const m={};
  TASKS.forEach(k=>{const t=S.tasks[k[0]];if(t.last&&t.last>=from&&t.last<=to)(m[t.last]=m[t.last]||[]).push({k,done:1})});
  plan(to).forEach(o=>{if(o.d>=from&&o.d<=to)(m[o.d]=m[o.d]||[]).push(o)});
  return m;
}
// Prochaine occurrence programmée de chaque tâche, à partir de la date from
function nextMap(from){const m=occ(from,add(today(),420)),r={};
  Object.keys(m).sort().forEach(d=>m[d].forEach(o=>{if(!o.done&&!r[o.k[0]])r[o.k[0]]={d,rep:o.rep,late:o.late}}));return r}

/* ============ AFFICHAGE ============ */
function row(o,date){
  const {k,done,late,n,rep}=o,t=S.tasks[k[0]],isToday=date===today();
  const can=done||(date<=today()||n===0);
  const sub=done?`Fait ${t.by?'par '+t.by+' ':''}aujourd’hui`:late?`⏰ En retard de ${late} jour${late>1?'s':''}`:rep?'Reportée (vacances ou absence)':per(k[2]);
  const act=done?`undo('${k[0]}')`:`validate('${k[0]}')`;
  return `<div class="card p-3 flex items-center gap-3 ${done?'opacity-70':''}" style="${late>0&&!done?'box-shadow:inset 4px 0 0 var(--ac)':''}">
    <div class="text-2xl w-10 h-10 grid place-items-center rounded-2xl flex-none" style="background:var(--ac2)">${k[3]}</div>
    <div class="flex-1 min-w-0"><div class="font-extrabold leading-tight ${done?'line-through':''}">${k[1]}</div>
    <div class="text-xs font-bold" style="color:${late?'var(--ac)':'var(--mu)'}">${sub}</div></div>
    ${can?`<button class="btn ${done?'done':''}" onclick="${act}" aria-label="Valider">✓</button>`:`<div class="w-11 text-center text-xs font-bold" style="color:var(--mu)">${fmt(date,{day:'numeric',month:'short'})}</div>`}
  </div>`}

const dayHead=s=>`<h2 class="text-lg capitalize mt-2 px-1">${fmt(s,{weekday:'long',day:'numeric',month:'long'})}</h2>`;
const empty=t=>`<div class="card p-5 text-center font-bold" style="color:var(--mu)">${t}</div>`;

function vDay(){
  const T=today(),m=occ(T,T),L=(m[T]||[]);
  const todo=L.filter(o=>!o.done).sort((a,b)=>(b.late||0)-(a.late||0)),dn=L.filter(o=>o.done);
  const tot=todo.length+dn.length,p=tot?Math.round(dn.length/tot*100):100;
  const nm=nextMap(add(T,1)),up=TASKS.filter(k=>nm[k[0]]).map(k=>[k,nm[k[0]].d]).sort((a,b)=>a[1]<b[1]?-1:1).slice(0,3);
  const fl={weekday:'long',day:'numeric',month:'long'};
  const bn=inAbs(T)?`✈️ Absence : toutes les tâches sont décalées du nombre de jours d’absence. Reprise le ${fmt(resume(inAbs),fl)}.`:inVac(T)?`🏖️ Vacances scolaires : seules les tâches de 15 jours ou moins sont programmées. Les autres reprennent après le ${fmt(add(resume(inVac),-1),fl)}, 2 par semaine maximum.`:'';
  let h=(bn?`<div class="card p-3 text-sm font-extrabold leading-snug" style="color:var(--ac)">${bn}</div>`:'')+`<div class="card p-4 flex items-center gap-4">
    <div class="bubble" style="--p:${p}"><div><div><div class="fr text-3xl leading-none">${dn.length}/${tot}</div><div class="text-xs font-bold" style="color:var(--mu)">aujourd’hui</div></div></div></div>
    <div><div class="fr text-xl leading-tight">${!tot?'Journée libre !':todo.length?'Allez, on y va doucement':'Tout est fait, bravo !'}</div>
    <div class="text-sm font-bold mt-1" style="color:var(--mu)">${S.score} tâche${S.score>1?'s':''} validée${S.score>1?'s':''} au total</div></div></div>`;
  const lt=todo.filter(o=>o.late>0),tdy=todo.filter(o=>!(o.late>0));
  if(lt.length)h+=`<h2 class="text-base mt-2 px-1" style="color:var(--ac)">⏰ En retard (${lt.length}) · à faire dès que possible</h2>`+lt.map(o=>row(o,T)).join('');
  if(tdy.length)h+=(lt.length?`<h2 class="text-base mt-2 px-1" style="color:var(--mu)">Aujourd’hui</h2>`:'')+tdy.map(o=>row(o,T)).join('');
  else if(!tot)h+=empty('Rien de prévu aujourd’hui. Profite !');
  if(dn.length)h+=`<h2 class="text-base mt-3 px-1" style="color:var(--mu)">Déjà fait</h2>`+dn.map(o=>row(o,T)).join('');
  if(up.length)h+=`<h2 class="text-base mt-3 px-1" style="color:var(--mu)">Bientôt</h2>`+up.map(([k,d])=>`<div class="card p-3 flex items-center gap-3 opacity-80"><div class="text-xl">${k[3]}</div><div class="flex-1 font-bold text-sm">${k[1]}</div><div class="text-xs font-extrabold" style="color:var(--mu)">${fmt(d)}</div></div>`).join('');
  return h;
}
// Cellule de jour et en-tête partagés par les vues Semaine et Mois
// Points : aucun = pas de tâche ; orange = il reste des tâches à faire ; vert = toutes les tâches du jour sont faites
const cell=(s,label,L)=>{
  const on=s===sel,td=s===today(),c=L.length,fin=c>0&&L.every(o=>o.done);
  const dot='<i class="w-1.5 h-1.5 rounded-full" style="background:'+(fin?'#2fb86d':'#ff9a3c')+(on?';box-shadow:0 0 0 1.5px #fff':'')+'"></i>';
  return `<button onclick="sel='${s}';render()" class="rounded-2xl font-extrabold text-sm h-12 flex flex-col items-center justify-center" style="background:${on?'var(--ac)':td?'var(--ac2)':'transparent'};color:${on?'#fff':'var(--tx)'};box-shadow:${inAbs(s)?'inset 0 -3px 0 var(--mu)':inVac(s)?'inset 0 -3px 0 #5aa9e6':'none'}">${label}
    <div class="flex justify-center gap-0.5 h-1.5 mt-0.5">${dot.repeat(Math.min(c,3))}</div></button>`};
const wdHead=L=>`<div class="grid grid-cols-7 text-center text-xs font-extrabold mb-1" style="color:var(--mu)">${L.map(x=>`<div>${x}</div>`).join('')}</div>`;
const wdays=wdHead(['L','M','M','J','V','S','D']);
const wd=a=>{const L=['D','L','M','M','J','V','S'],i=pd(a).getDay();return wdHead([...L.slice(i),...L.slice(0,i)])}; // initiales à partir du jour a
const dayList=(m,d)=>dayHead(d)+`<div class="space-y-2">`+((m[d]||[]).length?m[d].map(o=>row(o,d)).join(''):empty('Rien ce jour-là'))+`</div>`;
let wk=0;
function vWeek(){
  const a=add(today(),wk*7),b=add(a,6),m=occ(a,b); // la semaine commence aujourd’hui (jour J)
  if(sel<a||sel>b)sel=wk===0?today():a;
  let g='';for(let i=0;i<7;i++){const d=add(a,i);g+=cell(d,pd(d).getDate(),m[d]||[])}
  return `<div class="card p-3"><div class="flex items-center justify-between mb-2">
    <button class="chip" onclick="wk--;render()">‹</button>
    <div class="fr text-lg">${fmt(a,{day:'numeric',month:'short'})} – ${fmt(b,{day:'numeric',month:'short'})}</div>
    <button class="chip" onclick="wk++;render()">›</button></div>
    ${wd(a)}<div class="grid grid-cols-7 gap-y-1 text-center">${g}</div>${legend}</div>`+dayList(m,sel);
}
function vMonth(){
  const b=new Date();b.setDate(1);b.setMonth(b.getMonth()+mo);
  const y=b.getFullYear(),mm=b.getMonth(),first=iso(b),last=iso(new Date(y,mm+1,0));
  const m=occ(first,last),off=(b.getDay()+6)%7,n=new Date(y,mm+1,0).getDate();
  if(sel<first||sel>last)sel=mo===0?today():first;
  let g='';for(let i=0;i<off;i++)g+='<div></div>';
  for(let d=1;d<=n;d++){const s=iso(new Date(y,mm,d));g+=cell(s,d,m[s]||[])}
  return `<div class="card p-3"><div class="flex items-center justify-between mb-2">
    <button class="chip" onclick="mo--;render()">‹</button>
    <div class="fr text-lg capitalize">${b.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</div>
    <button class="chip" onclick="mo++;render()">›</button></div>
    ${wdays}<div class="grid grid-cols-7 gap-y-1 text-center">${g}</div>${legend}</div>`+dayList(m,sel);
}
function vYear(){
  const T=today(),m=occ(T,add(T,365)),by={};
  Object.keys(m).sort().forEach(d=>{const key=d.slice(0,7);(by[key]=by[key]||[]).push(...m[d].filter(o=>!o.done))});
  return Object.keys(by).map(key=>{const L=by[key],ids=[...new Set(L.map(o=>o.k[0]))].map(i=>TASKS.find(k=>k[0]===i));
    const lab=new Date(key+'-15T12:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
    return `<div class="card p-3"><div class="flex items-center justify-between"><div class="fr text-lg capitalize">${lab}</div>
      <div class="chip on text-xs">${L.length} tâche${L.length>1?'s':''}</div></div>
      <div class="flex flex-wrap gap-1.5 mt-2">${ids.map(k=>`<span class="rounded-full px-2.5 py-1 text-xs font-bold" style="background:var(--ac2)">${k[3]} ${k[1].split(' (')[0]}</span>`).join('')}</div></div>`}).join('');
}

function render(){
  rebuild();
  theme=themePref!=='auto'&&THEMES[themePref]?themePref:autoTheme();
  document.documentElement.dataset.th=theme;
  document.documentElement.style.backgroundImage=pattern(theme);document.documentElement.style.backgroundSize='260px';
  $('#ttl').textContent=THEMES[theme][0]+' Chez Nous, Tout Doux';
  $('#sub').textContent=(who?'Coucou '+who+' · ':'')+fmt(today(),{weekday:'long',day:'numeric',month:'long'});
  const tabs=[['day','Jour'],['week','Semaine'],['month','Mois'],['year','Année'],['manage','Gérer']];
  $('#tabs').innerHTML=tabs.map(([k,l])=>`<button class="chip flex-1 text-center ${V===k?'on':''}" style="padding:.5rem .1rem;font-size:.8rem" onclick="V='${k}';render();scrollTo(0,0)">${l}</button>`).join('');
  $('#main').innerHTML={day:vDay,week:vWeek,month:vMonth,year:vYear,manage:vManage}[V]();
  $('#fab').style.display=V==='manage'?'none':'grid';
}

/* ============ GESTION DES TÂCHES ============ */
function vManage(){
  const T=today(),NX=nextMap(T),L=[...TASKS].sort((a,b)=>a[2]-b[2]||a[1].localeCompare(b[1]));
  const gone=Object.keys(S.tasks).filter(i=>S.tasks[i].del);
  let h=`<button class="chip on w-full text-center py-3 fr text-base" onclick="editTask()">+ Ajouter une tâche</button>
    <button class="chip on w-full text-center py-3 fr text-base" onclick="editAbs()">✈️ Ajouter une absence</button>${absList()}
    <p class="text-sm font-bold px-1" style="color:var(--mu)">${L.length} tâches. Touche le crayon pour changer le nom, le rythme ou la prochaine date.</p>`;
  h+=L.map(k=>{const t=S.tasks[k[0]];
    return `<div class="card p-3 flex items-center gap-3">
      <div class="text-2xl w-10 h-10 grid place-items-center rounded-2xl flex-none" style="background:var(--ac2)">${k[3]}</div>
      <div class="flex-1 min-w-0"><div class="font-extrabold leading-tight">${k[1]}</div>
      <div class="text-xs font-bold" style="color:var(--mu)">${per(k[2])} · prochaine : ${NX[k[0]]?(NX[k[0]].late?'en retard':fmt(NX[k[0]].d,D0)+(NX[k[0]].rep?' (reportée)':'')):'—'}</div></div>
      <button class="card w-10 h-10 grid place-items-center" onclick="editTask('${k[0]}')" aria-label="Modifier">✏️</button></div>`}).join('');
  h+=vacInfo();
  if(gone.length)h+=`<h2 class="text-base mt-3 px-1" style="color:var(--mu)">Supprimées</h2>`+gone.map(i=>{
    const t=S.tasks[i],d=BASE.find(x=>x[0]===i)||[];
    return `<div class="card p-3 flex items-center gap-3 opacity-70"><div class="text-xl">${esc(t.icon||d[3])}</div><div class="flex-1 font-bold text-sm">${esc(t.name||d[1])}</div><button class="chip on text-xs" onclick="restoreTask('${i}')">Remettre</button></div>`}).join('');
  return h;
}
let EI='✨';
function editTask(id){
  const t=id&&S.tasks[id],k=id&&TASKS.find(x=>x[0]===id);
  const name=k?k[1]:'',days=k?k[2]:7,next=t?t.next:today();EI=k?k[3]:'✨';
  $('#layer').innerHTML=`<div class="sheet" onclick="if(event.target===this)closeSettings()"><div>
    <h2 class="text-xl mb-3">${id?'Modifier la tâche':'Nouvelle tâche'}</h2>
    <div class="font-extrabold mb-2">Icône</div>
    <div class="flex flex-wrap gap-2 mb-4" id="ico">${EMO.map(e=>`<button class="chip ${e===EI?'on':''}" style="font-size:1.25rem;padding:.3rem .6rem" onclick="pickIcon('${e}')">${e}</button>`).join('')}</div>
    <div class="font-extrabold mb-1">Nom</div>
    <input id="e-name" value="${name}" placeholder="Ex. Arroser les plantes" class="mb-4">
    <div class="font-extrabold mb-2">À refaire</div>
    <div class="flex flex-wrap gap-2 mb-2">${[[7,'Chaque semaine'],[15,'15 jours'],[30,'Chaque mois'],[90,'Trimestre'],[365,'Chaque année']].map(([n,l])=>`<button class="chip" onclick="$('#e-days').value=${n}">${l}</button>`).join('')}</div>
    <div class="flex items-center gap-2 mb-4"><span class="font-bold">Tous les</span><input id="e-days" type="number" min="1" max="999" value="${days}" style="width:90px"><span class="font-bold">jours</span></div>
    <div class="font-extrabold mb-1">Prochaine échéance</div>
    <input id="e-next" type="date" value="${next}" class="mb-4">
    <button class="chip on w-full text-center py-3" onclick="saveTask('${id||''}')">Enregistrer</button>
    ${id?`<button class="w-full text-center py-3 mt-1 font-extrabold" style="color:var(--ac)" onclick="delTask('${id}')">Supprimer cette tâche</button>`:''}
  </div></div>`;
}
function pickIcon(e){EI=e;document.querySelectorAll('#ico .chip').forEach(b=>b.classList.toggle('on',b.textContent===e))}
function saveTask(id){
  const name=$('#e-name').value.trim(),days=parseInt($('#e-days').value),next=$('#e-next').value||today();
  if(!name){$('#e-name').focus();return}
  if(!(days>0)){$('#e-days').focus();return}
  if(id){const t=S.tasks[id];t.name=name;t.days=Math.min(days,999);t.icon=EI;t.next=next;t.at=Date.now()}
  else{const i='c'+Date.now().toString(36);S.tasks[i]={last:null,next,at:Date.now(),name,days:Math.min(days,999),icon:EI,custom:1,ord:Date.now()}}
  save();closeSettings();render();
}
function delTask(id){
  if(!confirm('Supprimer cette tâche ? Tu pourras la remettre depuis l’onglet Gérer.'))return;
  const t=S.tasks[id];t.del=1;t.at=Date.now();save();closeSettings();render();
}
function restoreTask(id){const t=S.tasks[id];t.del=0;t.at=Date.now();save();render()}

/* ============ VACANCES & ABSENCES ============ */
// Absences à venir (affichées en haut de l’onglet Gérer, sous les boutons d’ajout)
function absList(){
  const T=today(),A=Object.keys(S.abs||{}).filter(i=>S.abs[i]&&!S.abs[i].del&&S.abs[i].to>=T).sort((x,y)=>S.abs[x].from<S.abs[y].from?-1:1);
  return A.map(i=>{const a=S.abs[i];return `<div class="card p-3 flex items-center gap-3"><div class="text-2xl">✈️</div>
      <div class="flex-1 min-w-0"><div class="font-extrabold leading-tight">${esc(a.name||'Absence')}</div><div class="text-xs font-bold" style="color:var(--mu)">du ${fmt(a.from,D0)} au ${fmt(a.to,D0)} · tâches décalées de ${diff(a.to,a.from)+1} j</div></div>
      <button class="card w-10 h-10 grid place-items-center" onclick="editAbs('${i}')" aria-label="Modifier">✏️</button></div>`}).join('');
}
function vacInfo(){
  const nv=VS.filter(v=>v[1]>=today()).slice(0,3);
  return `<h2 class="text-base mt-3 px-1" style="color:var(--mu)">Vacances scolaires</h2>
    <div class="card p-3 text-sm font-bold leading-snug" style="color:var(--mu)">🏖️ Zone B : ${nv.map(v=>v[2]+' du '+fmt(v[0],D0)+' au '+fmt(v[1],D0)).join(' · ')}.<br>Pendant ces périodes, seules les tâches de 15 jours ou moins sont programmées. Les autres sont reportées après, 2 par semaine maximum, dans l’ordre prévu.</div>`;
}
function editAbs(id){
  const a=id&&S.abs[id];
  $('#layer').innerHTML=`<div class="sheet" onclick="if(event.target===this)closeSettings()"><div>
    <h2 class="text-xl mb-1">${id?'Modifier l’absence':'Nouvelle absence'}</h2>
    <p class="text-sm mb-3" style="color:var(--mu)">Toutes les tâches à venir sont décalées du nombre de jours d’absence. Rien n’est programmé pendant l’absence.</p>
    <div class="font-extrabold mb-1">Nom (facultatif)</div>
    <input id="a-name" value="${a?esc(a.name||''):''}" placeholder="Ex. Vacances en famille" class="mb-4">
    <div class="font-extrabold mb-1">Premier jour d’absence</div>
    <input id="a-from" type="date" value="${a?a.from:today()}" class="mb-4">
    <div class="font-extrabold mb-1">Dernier jour d’absence</div>
    <input id="a-to" type="date" value="${a?a.to:add(today(),6)}" class="mb-4">
    <button class="chip on w-full text-center py-3" onclick="saveAbs('${id||''}')">Enregistrer</button>
    ${id?`<button class="w-full text-center py-3 mt-1 font-extrabold" style="color:var(--ac)" onclick="delAbs('${id}')">Supprimer cette absence</button>`:''}
  </div></div>`;
}
function saveAbs(id){
  const name=$('#a-name').value.trim(),from=$('#a-from').value,to=$('#a-to').value;
  if(!from||!to||to<from){$('#a-to').focus();return}
  S.abs=S.abs||{};S.abs[id||'a'+Date.now().toString(36)]={from,to,name,at:Date.now()};
  save();closeSettings();render();
}
function delAbs(id){if(!confirm('Supprimer cette absence ?'))return;const a=S.abs[id];a.del=1;a.at=Date.now();save();closeSettings();render()}

/* ============ RÉGLAGES ============ */
function openSettings(){
  $('#layer').innerHTML=`<div class="sheet" onclick="if(event.target===this)closeSettings()"><div>
    <h2 class="text-xl mb-3">Réglages</h2>
    <div class="font-extrabold mb-2">Thème</div>
    <div class="flex flex-wrap gap-2 mb-1"><button class="chip ${themePref==='auto'||!THEMES[themePref]?'on':''}" onclick="themePref='auto';lset('mmj-theme',themePref);render();openSettings()">✨ Auto</button>${Object.entries(THEMES).map(([k,[e,l]])=>`<button class="chip ${themePref===k?'on':''}" onclick="themePref='${k}';lset('mmj-theme',themePref);render();openSettings()">${e} ${l}</button>`).join('')}</div>
    <p class="text-xs font-bold mb-4" style="color:var(--mu)">Auto : la saison change toute seule, et les fêtes (Halloween, Noël, Nouvel An, Pâques) arrivent 15 jours avant. Thème actuel : ${THEMES[theme][1]}.</p>
    <div class="font-extrabold mb-2">Mon prénom</div>
    <input id="f-who" value="${who}" placeholder="Ton prénom" class="mb-4">
    <div class="font-extrabold mb-1">Rappel quotidien</div>
    <div class="flex items-center gap-2 mb-1">
      <button class="chip ${NT.on?'on':''}" onclick="toggleNotif()">${NT.on?'🔔 Activé':'🔕 Désactivé'}</button>
      <input type="time" value="${NT.time}" style="width:120px" onchange="NT.time=this.value||'09:00';lset('mmj-notif',NT);checkNotify()">
      <button class="chip" onclick="testNotif()">Tester</button>
    </div>
    <p class="text-xs font-bold mb-4" style="color:var(--mu)">Chaque jour, la liste des tâches du jour (avec celles en retard). Pas de rappel pendant une absence ni s’il n’y a rien à faire.</p>
    <div class="font-extrabold mb-1">Synchronisation à deux</div>
    <p class="text-sm mb-2" style="color:var(--mu)">Même code du foyer sur les deux téléphones, et l’adresse d’une base Firebase Realtime Database (mode test). Sans cela, tout reste sur cet appareil.</p>
    <input id="f-url" value="${cfg?cfg.url:''}" placeholder="https://mon-projet-default-rtdb.firebaseio.com" class="mb-2">
    <input id="f-code" value="${cfg?cfg.code:''}" placeholder="Code du foyer (ex. maison-fleurie-42)" class="mb-4">
    <button class="chip on w-full text-center py-3" onclick="saveSettings()">Enregistrer</button>
  </div></div>`;
}
function closeSettings(){$('#layer').innerHTML=''}
function saveSettings(){
  who=$('#f-who').value.trim();lset('mmj-who',who);
  const u=$('#f-url').value.trim(),c=$('#f-code').value.trim();
  cfg=u&&c?{url:u,code:c}:null;lset('mmj-cfg',cfg);
  closeSettings();render();listen();pull();
}

/* ============ RAPPEL QUOTIDIEN (9 h par défaut) ============ */
/* Une appli web sans serveur ne peut pas se réveiller seule : le rappel part à l’heure choisie si l’appli est ouverte
   ou en arrière-plan, sinon à la première ouverture de la journée (si l’heure est passée). */
let NT=ls('mmj-notif',{on:false,time:'09:00'}),ntTimer;
const unesc=t=>t.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
function todayBrief(){
  const T=today();if(inAbs(T))return null;
  const L=(occ(T,T)[T]||[]).filter(o=>!o.done).sort((a,b)=>(b.late||0)-(a.late||0));if(!L.length)return null;
  const late=L.filter(o=>o.late>0).length,names=L.slice(0,4).map(o=>unesc(o.k[1]));
  return `${L.length} tâche${L.length>1?'s':''} aujourd’hui${late?' (dont '+late+' en retard ⏰)':''} : ${names.join(', ')}${L.length>4?'…':''}`;
}
// Service worker prêt à afficher la notification (Android exige showNotification, pas new Notification)
async function swReg(){
  if(!navigator.serviceWorker)return null;
  let r=await navigator.serviceWorker.getRegistration();
  if(!r){try{r=await navigator.serviceWorker.register('sw.js')}catch(e){return null}}
  if(r.active)return r;
  return Promise.race([navigator.serviceWorker.ready,new Promise(res=>setTimeout(()=>res(null),4000))]);
}
// Renvoie 'ok' ou la raison de l’échec
async function notify(force){
  if(!('Notification' in window))return 'nosupport';
  if(Notification.permission!=='granted')return 'denied';
  const b=todayBrief();if(!b&&!force)return 'empty';
  const title=THEMES[theme][0]+' Chez Nous, Tout Doux';
  // tag unique pour un test (sinon Android remplace la précédente notification sans alerte) ; tag du jour pour le rappel
  const o={body:b||'Rien de prévu aujourd’hui. Profite !',tag:force?'test-'+Date.now():'jour-'+today(),renotify:true,vibrate:[100,50,100]};
  try{const r=await swReg();if(r){await r.showNotification(title,o);return 'ok'}}catch(e){}
  try{new Notification(title,o);return 'ok'}catch(e){return 'nosw'}
}
const dueAt=()=>{const [h,m]=NT.time.split(':'),d=new Date();d.setHours(+h||9,+m||0,0,0);return d};
async function checkNotify(){
  clearTimeout(ntTimer);if(!NT.on)return;
  const T=today(),at=dueAt();
  if(ls('mmj-last','')!==T&&new Date()>=at){lset('mmj-last',T);await notify()}
  const next=ls('mmj-last','')!==T&&new Date()<at?at:new Date(at.getTime()+864e5);
  ntTimer=setTimeout(checkNotify,Math.min(next-new Date()+1000,2e9));
}
async function toggleNotif(){
  if(!NT.on){
    if(!('Notification' in window)){alert('Les notifications ne sont pas disponibles ici. Sur iPhone, installe d’abord l’appli sur l’écran d’accueil.');return}
    const p=Notification.permission==='granted'?'granted':await Notification.requestPermission();
    if(p!=='granted'){alert('Autorise les notifications dans les réglages du navigateur pour activer le rappel.');return}
  }
  NT.on=!NT.on;lset('mmj-notif',NT);openSettings();checkNotify();
}
async function testNotif(){
  if(!('Notification' in window)||Notification.permission!=='granted'){alert('Active d’abord le rappel (🔔) et autorise les notifications.');return}
  const r=await notify(true);
  alert(r==='ok'?'Notification envoyée ✅ Regarde en haut de l’écran ou dans la barre de notifications.':
    r==='nosw'?'Impossible d’afficher la notification : sw.js est introuvable ou pas encore actif. Vérifie qu’il est sur GitHub à côté de index.html, puis recharge l’appli deux fois.':
    'Notification non envoyée ('+r+').');
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkNotify()});

/* ============ PWA ============ */
const icon="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#ff8fb1"/><text x="50" y="68" font-size="56" text-anchor="middle">🏡</text></svg>');
$('#mf').href=URL.createObjectURL(new Blob([JSON.stringify({name:'Chez Nous, Tout Doux',short_name:'Chez Nous',display:'standalone',background_color:'#fff0f5',theme_color:'#ff8fb1',icons:[{src:icon,sizes:'any',type:'image/svg+xml',purpose:'any'}]})],{type:'application/manifest+json'}));
/* sw.js (fichier fourni à côté de celui-ci) : mode hors-ligne, mises à jour automatiques et notifications. */
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

render();listen();pull();checkNotify();
setInterval(()=>{if(document.visibilityState==='visible')pull()},30000);
</script>
